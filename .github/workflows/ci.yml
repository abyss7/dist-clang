name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        clang: [16, 18]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The version is counted from the history of master.
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev \
            clang-${{ matrix.clang }} lld-${{ matrix.clang }}
          curl -sSL -o gn.zip \
            https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest
          unzip -q gn.zip -d "$HOME/gn"
          echo "$HOME/gn" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          build/configure 'clang_cc="clang-${{ matrix.clang }}"' \
                          'clang_cxx="clang++-${{ matrix.clang }}"'

      - name: Build
        run: |
          ninja -C out/Release All
          ninja -C out/Test Tests

      - name: Test
        run: build/run_all_tests

      - name: Smoke test
        run: build/smoke_test clang++-${{ matrix.clang }}
