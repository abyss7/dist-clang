syntax = "proto2";

import "net/universal.proto";

package dist_clang.perf.proto;

message Metric {
  enum Name {
    DIRECT_CACHE_HIT   = 1;
    DIRECT_CACHE_MISS  = 2;
    SIMPLE_CACHE_HIT   = 3;
    SIMPLE_CACHE_MISS  = 4;

    REMOTE_TIME_WASTED = 5;
    // in milliseconds.

    REMOTE_TASK_DONE   = 6;
    LOCAL_TASK_DONE    = 7;

    CACHE_SIZE_CLEANED = 8;
    // in bytes.

    CACHE_SIZE_ADDED   = 9;
    // in bytes.

    REMOTE_COMPILATION_FAILED   = 10;
    REMOTE_COMPILATION_REJECTED = 11;

    REMOTE_RESOLVE_TIME         = 12;
    // in milliseconds.

    REMOTE_CONNECT_TIME         = 13;
    // in milliseconds.

    PREPROCESS_TIME             = 14;
    // in milliseconds.

    DIRECT_CACHE_LOOKUP_TIME    = 15;
    // in milliseconds.

    SIMPLE_CACHE_LOOKUP_TIME    = 16;
    // in milliseconds.

    LOCAL_COMPILATION_TIME      = 17;
    // in milliseconds.

    REMOTE_COMPILATION_TIME     = 18;
    // in milliseconds.

    DIRECT_CACHE_UPDATE_TIME    = 19;
    // in milliseconds.

    SIMPLE_CACHE_UPDATE_TIME    = 20;
    // in milliseconds.

    REMOTE_CACHE_HIT            = 21;

    HASH_MISMATCH               = 22;

    UNSUPPORTED_COMMAND         = 23;
    // Commands, which weren't handled by daemon and were run as is.

    CACHE_OWN_SIZE              = 26;
    CACHE_SHARED_SIZE           = 27;
    // in bytes - the cache files, that are and aren't linked with other places.

    CACHE_ENTRIES               = 28;

    PARALLEL_PREPROCESSING      = 38;
    PARALLEL_PREPROCESSING_HIT  = 39;
    // Preprocessings at the same time with the compilations, and the ones,
    // that found the result in the simple cache before the compilation ended.

    CACHE_INCOMPATIBLE          = 40;
    // 1, if the cache isn't used: it's written by a newer daemon, that has
    // changed the format incompatibly.

    CACHE_BLOB_REUSED           = 37;
    // Outputs, that are stored once for several entries.

    HIT_VERIFIED                = 35;
    HIT_VERIFICATION_FAILED     = 36;
    // Cache hits, compiled again in background to compare the results - see
    // |verify_hits_percent|. The failed ones are removed from the cache.

    CACHE_STORE_SKIPPED         = 34;
    // Results, that aren't cached: their inputs are modified during the
    // compilation.

    TASK_CANCELED               = 33;
    // Tasks abandoned, since the client has disconnected.

    WARNINGS_RECHECKED          = 32;
    // Cache hits with other warnings, checked with "-fsyntax-only".

    PREPROCESSING_SKIPPED       = 31;
    // Edited sources, compiled without preprocessing.

    CACHE_OUTPUT_UNCHANGED      = 29;
    LOCAL_OUTPUT_UNCHANGED      = 30;
    // Outputs, that are the same after the cache hit or the compilation, and
    // are kept untouched.

    CACHE_OUTPUT_LINKED         = 24;
    CACHE_OUTPUT_COPIED         = 25;
    // Output files restored from the cache: linked (copy-on-write clone or
    // hard link), or copied.
  }

  required Name name    = 1;
  optional uint64 value = 2;
}

message Report {
  repeated Metric metric = 1;

  extend net.proto.Universal {
    optional Report extension = 7;
  }
}
