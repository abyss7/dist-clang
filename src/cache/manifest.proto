syntax = "proto2";

package dist_clang.cache.proto;

enum Compression {
  NONE = 0;
  ZSTD = 2;
}

// The format of the whole cache - in the file "format" in its root.
message Format {
  required uint32 generation = 1;
  // Changes with the incompatible changes of the layout: the cache of an
  // older generation is removed, the cache of a newer one isn't used.

  optional uint32 revision   = 2;
  // Changes with the compatible changes: the older daemons of the same
  // generation still use the cache.

  optional string written_by = 3;
  // The version of the daemon, that has written the format - for diagnostics.
}

message Direct {
  message Variant {
    repeated string headers = 1;

    repeated string ignored_paths = 2;
    // Files with the same relative paths as the headers in the search
    // directories before them, which existed during the compilation, but
    // weren't used - e.g. because of "#include_next". The other such paths
    // must not exist: a new file there would be found instead of the header.
  }

  repeated Variant variants = 2;
  // Different sets of headers of the same source, e.g. from different branches.
  // The most recently stored variant goes first.
}

// The result of a compilation. The object and split DWARF files are in the
// blob store - by the hashes of their contents.
message Simple_Version1 {
  optional uint64 size = 2;
  // Size in bytes of the files of the entry without the manifest and the
  // blobs.

  optional bool err = 101;
  optional bool obj = 102;
  optional bool dep = 103;
  optional bool dwo = 104;

  optional string object_hash = 105;
  optional string dwo_hash    = 106;
  optional string stderr_hash = 108;
  optional string deps_hash   = 109;
  // Hashes of the uncompressed contents of all files - every hit checks them:
  // the files may be broken by a crash or modified through a hard link.

  optional string warnings_hash = 107;
  // Hash of the warning flags, which produced the diagnostics in "stderr".

  optional uint64 compilation_time = 110;
  // in milliseconds - the time, that the hits save. Since the revision 2.
}

message Manifest {
  optional uint32 version = 3 [ default = 0 ];

  oneof CacheType {
    Direct direct      = 4;
    Simple_Version1 v1 = 5;
  }
}
