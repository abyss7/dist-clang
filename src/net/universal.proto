syntax = "proto2";

// It's not possible to optimize for LITE_RUNTIME, since the configuration uses
// |TextFormat::Parse()|, which uses the descriptor and the reflection.

import "base/base.proto";
import "daemon/configuration.proto";
import "daemon/remote.proto";
import "perf/stat.proto";

package dist_clang.net.proto;

message Status {
  enum Code {
    OK            = 0;
    INCONSEQUENT  = 1;
    NETWORK       = 2;
    BAD_MESSAGE   = 3;
    EMPTY_MESSAGE = 4;
    EXECUTION     = 5;
    OVERLOAD      = 6;
    NO_VERSION    = 7;
    UNSUPPORTED   = 8;
    // The command can't be handled by the daemon - run it as is.
  }

  required Code code           = 1 [ default = OK ];
  optional string description  = 2;
}

// Every message between the client and the daemons. Several parts may go
// together, e.g. a result with its status. The numbers of the fields are the
// ones of the extensions of the older versions - the messages stay the same
// on the wire.
message Universal {
  optional Status status                            = 2;
  optional daemon.proto.Result result               = 4;
  optional base.proto.Local local                   = 5;
  optional daemon.proto.Remote remote               = 6;
  optional perf.proto.Report report                 = 7;
  optional daemon.proto.Configuration configuration = 8;
  optional base.proto.TagsRequest tags_request      = 9;
  optional base.proto.TagsReport tags_report        = 10;
  optional base.proto.StopRequest stop_request      = 11;
}
