syntax = "proto2";

import "base/base.proto";

package dist_clang.client.proto;

// Unsupported - only reported.
message Plugin {
  enum Platform {
    UNKNOWN = 0;
    LINUX   = 1;
    MACOSX  = 2;
    WIN     = 3;
  }

  required string name = 1;
  required string path = 2;
  optional Platform os = 3 [ default = UNKNOWN ];
}

message Configuration {
  // The real compiler - found in PATH, if empty.
  optional string path            = 1;
  optional string version         = 2;  // Unsupported - only reported.

  optional uint32 connect_timeout = 3 [ default = 10 ];
  // in seconds. Zero means default.

  optional uint32 send_timeout    = 4 [ default = 5  ];
  // in seconds.

  optional uint32 read_timeout    = 5 [ default = 3600 ];
  // in seconds - includes the time of compilation by daemon.

  optional uint32 read_minimum    = 6 [ default = 32 ];
  // in bytes.

  repeated Plugin plugins         = 7;  // Unsupported - only reported.
  optional bool disabled          = 8 [ default = false ];
  optional base.proto.Verbosity verbosity = 9;

  optional bool rewrite_includes  = 10 [ default = false ];
  // Unsupported - only reported.
}
