syntax = "proto2";


package dist_clang.base.proto;

message Plugin {
  required string name    = 1;
  optional string path    = 2;
}

message Compiler {
  required string version = 1;
  optional string path    = 2;
  repeated Plugin plugins = 3;
}

message Argument {
  optional uint32 index  = 1;
  repeated string values = 2;
}

// Flags of a single compilation, classified by the daemon from the driver's
// command line. All argument lists keep their original indices, so that the
// original order of flags can be restored.
message Flags {
  required Compiler compiler         = 1;
  // |path| is the compiler executable to run, |version| is its identity.

  optional string output             = 2;
  // "-o" flag and it's param.

  optional string input              = 3;
  // path to the source file, as passed.

  repeated Argument other            = 4;
  // all unclassified flags: affect both preprocessing and compilation.

  optional string deps_file          = 5;
  // path to the dependency file, if it's generated.

  optional string language           = 6;
  // absorbs "-x" flag and stores it's param.

  repeated Argument non_cached       = 7;
  // flags, that affect only preprocessing (e.g. -I, -D) - their effect is
  // visible in the preprocessed source.

  repeated Argument cc_only          = 8;
  // flags for compilation only - not used for preprocessing.

  required string action             = 9;
  // "-c", "-E", etc.

  repeated Argument non_direct       = 10;
  // flags, that don't affect the result, but have to be passed both for
  // preprocessing and compilation (e.g. dependency file generation).

  optional string sanitize_blacklist = 11;
  // sanitizer blacklist file

  repeated string included_files     = 12;
  // precompiled headers, included explicitly through command line arguments.
  // Their sources are still visible in the preprocessed source.

  optional bool rewrite_includes     = 13;
  // Indicates if preprocessing should/was made using 'frewrite-includes' flag.

  repeated Argument ignored          = 14;
  // flags for compilation only, that don't affect the result
  // (e.g. -ftime-trace).

  repeated string env                = 15;
  // environment of the compiler: "NAME=value".

  optional string deps_target        = 16;
  // target of the dependency file rule, already escaped for Make.

  optional string dwo_file           = 17;
  // path to the split DWARF file, if it's generated.

  repeated string key_files          = 19;
  // files, which contents affect the result, but aren't visible in the
  // preprocessed source: profiles, sanitizer lists, plugins, etc.

  repeated Argument warnings         = 20;
  // flags, that enable or disable warnings: they affect the diagnostics and
  // the success of the compilation, but not the result.

  optional bool color_diagnostics    = 21;
  // if the diagnostics are expected to be colored.

  optional bool recheck_warnings     = 22;
  // if set, |warnings| aren't a part of the cache key: a cached result,
  // produced with other warnings, is rechecked with "-fsyntax-only".

  optional bool relocatable          = 23;
  // if the result doesn't depend on the location of the sources: the paths
  // in the "__FILE__" macro and in the debug info are remapped.

  optional bool records_command_line = 26;
  // if the debug info may contain the command line of the compiler - with the
  // paths of the outputs, that aren't a part of the cache key.

  optional string key_root           = 24;
  optional string key_root_relative  = 25;
  // the source root and its path relative to the current directory - they are
  // replaced with a placeholder in the cache key, so that the same sources
  // from different locations have the same key.

  repeated string key_extra          = 18;
  // parts of the cache key that aren't flags: the environment, the current
  // directory for the debug info, etc.

  // Compilation   = other + non_cached + cc_only + non_direct + ignored
  //                 + warnings
  // Preprocessing = other + non_cached + non_direct + warnings
  // Cache         = other + language + cc_only + key_extra
  //                 + warnings (unless |recheck_warnings|)
  // Direct        = other + language + cc_only + non_cached + key_extra
  //                 + warnings (unless |recheck_warnings|)
}

// Sent from client to emitter.
message Local {
  optional Flags flags         = 1;
  // filled by the emitter from |args|.

  required string current_dir  = 2;

  optional uint32 user_id      = 3;
  // Owner of local objects.

  repeated string args         = 4;
  // original command line: the compiler followed by its arguments.

  repeated string env          = 5;
  // environment of the client: "NAME=value".
}

// Sent from client to emitter: the statistics of the tags of the cache, or
// the removal of a tag.
message TagsRequest {
  optional string forget = 1;
  // The tag to remove: the entries, that only it uses, are removed too.

  optional bool dry_run  = 2 [ default = true ];

  optional bool forget_ghosts = 3;
  // Forget the records of the removed entries - see |ghosts_ttl|.
}

message TagsReport {
  message Tag {
    required string name              = 1;
    // Empty for the entries without tags.

    optional uint64 entries           = 2;
    optional uint64 size              = 3;
    optional uint64 exclusive_entries = 4;
    optional uint64 exclusive_size    = 5;
    // Only of this tag.

    optional uint64 linked_size       = 6;
    // The part of |size|, that is linked with build directories.

    optional uint64 freeable_size     = 7;
    // What the removal of the tag frees now.

    optional uint64 lost_entries      = 8;
    optional uint64 lost_time         = 9;
    // The removed entries of the tag, that are compiled again - and the time
    // of these compilations in milliseconds.
  }
  repeated Tag tags = 1;

  message Overlap {
    required string first  = 1;
    required string second = 2;
    optional uint64 size   = 3;
  }
  repeated Overlap overlaps = 2;

  // The result of |TagsRequest::forget|.
  optional uint64 removed_entries = 3;
  optional uint64 freed_size      = 4;
  optional uint64 shared_entries  = 5;
  optional uint64 linked_entries  = 6;

  // The result of |TagsRequest::forget_ghosts|.
  optional uint64 removed_ghosts  = 7;
}

message Verbosity {
  message Range {
    required uint32 right = 1;

    optional uint32 left  = 2;
    // if omitted: [ default = right ];
  }

  optional uint32 error_mark = 1 [ default = 10 ];
  // level ≤ |error_mark| goes to stderr.

  repeated Range levels      = 2;
  // all ranges are inclusive: [left, right].
}
