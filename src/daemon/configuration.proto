syntax = "proto2";

import "base/base.proto";
import "net/universal.proto";

package dist_clang.daemon.proto;

message Host {
  required string host          = 1;
  optional uint32 port          = 2 [ default = 6000 ];

  optional uint32 threads       = 3 [ default = 2 ];
  // Ignored for coordinators and collectors.

  optional bool disabled        = 4 [ default = false ];
  optional bool ipv6            = 5 [ default = false ];

  optional uint32 shard         = 6;
  // Ignored for coordinators and collectors.
}

message Configuration {
  message Cache {
    required string path         = 1;

    optional uint64 size         = 2 [ default = 0 ];
    // 0 - is unlimited

    optional bool direct         = 4 [ default = false ];

    optional bool mtime          = 5 [ default = false ];
    // TODO: not implemented yet.

    optional bool disabled       = 6 [ default = false ];
    optional bool snappy         = 7 [ default = true ];
    // OBSOLETE: "false" disables the compression, if there is no
    // |compression|.

    enum Compression {
      NONE   = 0;
      SNAPPY = 1;
      ZSTD   = 2;
    }
    optional Compression compression = 14 [ default = ZSTD ];
    // The compression of the stored object and split DWARF files - if they
    // aren't linked.

    optional uint32 threads      = 8;
    // |std::thread::hardware_concurrency()| is default.

    optional uint32 clean_period = 9 [ default = 600 ];
    // in seconds.

    optional bool store_index    = 10 [ default = true ];

    optional bool link_outputs   = 11 [ default = true ];
    // Store outputs uncompressed, and link them into and out of the cache
    // without copying: as copy-on-write clones or as read-only hard links.
    // Only for emitters; overrides |compression|.

    repeated string source_roots = 13;
    // Absolute paths of the source trees, that are checked out in several
    // places, e.g. as worktrees. The same sources under different roots get
    // the same cache key - if their compilation is relocatable: uses
    // "-fmacro-prefix-map" (or "-ffile-prefix-map"), and with the debug info
    // also "-fdebug-prefix-map" and "-fdebug-compilation-dir".

    optional uint64 compress_after = 15 [ default = 3600 ];
    // In seconds. With |link_outputs| compress the outputs of the entries,
    // that aren't linked with build directories anymore - e.g. the results
    // of other branches - and weren't used for this time. They are restored
    // as copies then. Zero disables it.

    optional uint32 min_free_percent = 12 [ default = 5 ];
    // Remove entries, while the disk has less free space - even if the cache
    // isn't full. Entries, that are linked with build directories, are kept.
  }

  message Emitter {
    required string socket_path     = 1;
    repeated Host remotes           = 2;
    optional uint32 threads         = 3 [ default = 2 ];
    optional bool only_failed       = 4 [ default = false ];

    optional uint32 poll_interval   = 5 [ default = 300 ];
    // Interval in seconds for polling coordinator.

    repeated Host coordinators      = 6;
    optional uint32 total_shards    = 7;
    // Number of total shards can't be less than 2.

    optional uint32 pop_timeout     = 8 [ default = 1 ];
    // in seconds - can't be zero.

    optional uint32 shard_queue_limit = 9 [ default = 0 ];
    // Implies strict sharding if specified limit is larger than zero.
    // All tasks of shard that exceed limit can be redistributed between other
    // shards.

    optional bool recheck_warnings = 11 [ default = false ];
    // Don't make warning flags a part of the cache key. If a cached result was
    // produced with other warning flags, check the source with "-fsyntax-only"
    // and the current flags, and take the object file from the cache. It saves
    // the code generation, when only warnings change, but misses the warnings
    // of the backend, e.g. "-Wframe-larger-than".

    enum Preprocessing {
      ALWAYS    = 0;
      // Preprocess the source on a miss of the direct cache, and look for it
      // in the simple cache - then compile.

      WHEN_IDLE = 1;
      // Compile at once, and preprocess at the same time, while there are
      // idle CPUs: if the preprocessed source is found in the simple cache
      // before the compilation ends, the compilation is canceled. The result
      // is stored for both caches.

      NEVER     = 2;
      // Compile at once: only the direct cache is used.
    }
    optional Preprocessing preprocessing = 13 [ default = WHEN_IDLE ];
    // What to do on a miss of the direct cache. The edited sources are never
    // preprocessed, the compilations without the dependency files are always
    // preprocessed - the direct cache doesn't work for them - and so are all
    // compilations with remotes.

    optional uint32 verify_hits_percent = 12 [ default = 0 ];
    // The percent of the cache hits, that are compiled again in background
    // with the lowest priority, to compare the results with the cached ones.
    // A mismatch means that something, which affects the result, isn't a
    // part of the cache key: it's reported to the log and to the statistics,
    // and the entry is removed. The compilations, that record the command
    // line in the debug info, aren't checked - the path of the output differs.

    optional bool keep_unchanged_outputs = 10 [ default = false ];
    // Don't touch the outputs, that don't change after the compilation or the
    // cache hit: then they keep their modification time, and the build system,
    // that re-stats outputs (e.g. Ninja with "restat = 1"), doesn't rebuild the
    // dependent targets. Without re-stating the build system would consider
    // such outputs as always outdated. The client may request it per command
    // with "--restat" flag or "DC_RESTAT=1" environment variable.
  }

  message Absorber {
    required Host local = 1;

    optional uint32 run_timeout = 2 [ default = 60 ];
    // in seconds.
  }

  message Collector {
    required Host local = 1;
  }

  message Coordinator {
    required Host local          = 1;

    optional uint32 total_shards = 2;
    repeated Host remotes        = 3;
    // Hosts to be propogated to clients and used as remotes.

    optional uint32 shard_queue_limit = 4 [ default = 0 ];
  }

  // FIXME: use new protobuf feature "anyof" for emitter and absorber.
  optional Emitter emitter         = 1;
  optional Absorber absorber       = 2;

  optional Collector collector     = 3;

  optional uint32 pool_capacity    = 4 [ default = 16 ];
  // 0 - is unlimited.

  repeated base.proto.Compiler versions = 5;
  optional base.proto.Verbosity verbosity  = 6;
  optional uint32 user_id          = 7;

  optional string config_path      = 8;
  // allows reloading of config changes.

  optional Cache cache             = 9;

  optional uint32 connect_timeout  = 10 [ default = 10 ];
  // in seconds. Zero means system default.

  optional uint32 read_timeout     = 11 [ default = 60 ];
  // in seconds.

  optional uint32 send_timeout     = 12 [ default = 5  ];
  // in seconds.

  optional uint32 read_minimum     = 13 [ default = 32 ];
  // in bytes.

  optional Coordinator coordinator = 14;

  extend net.proto.Universal {
    optional Configuration extension = 8;
  }
}
